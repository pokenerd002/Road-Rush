<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Rush</title>
<style>
  html, body { margin:0; height:100%; background:#0b0b10; overflow:hidden; font-family:Arial,Helvetica,sans-serif; color:#fff; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { --u:calc(min(100vw,60vh)/100); position:relative; width:min(100vw,60vh); aspect-ratio:3/5; background:#000; overflow:hidden; user-select:none; -webkit-user-select:none; }
  #c { width:100%; height:100%; display:block; touch-action:none; }
  .ov { position:absolute; left:0; top:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--u)*2.5); background:rgba(0,0,0,.55); text-align:center; padding:calc(var(--u)*4); box-sizing:border-box; z-index:5; font-size:calc(var(--u)*3.6); }
  .ov.hidden { display:none; }
  .ov h1 { margin:0; font-size:calc(var(--u)*12); letter-spacing:2px; text-shadow:0 4px 0 #b71c1c, 0 0 20px rgba(255,80,60,.6); }
  .ov h2 { margin:0; font-size:calc(var(--u)*9); }
  .ov h3 { margin:calc(var(--u)*1.5) 0 0; font-size:calc(var(--u)*4); color:#ffd54f; }
  .sub { font-size:calc(var(--u)*4.2); color:#ddd; }
  .help { font-size:calc(var(--u)*3); color:#bbb; line-height:1.6; margin:0; }
  button { font:inherit; cursor:pointer; color:#fff; }
  .big { font-weight:bold; font-size:calc(var(--u)*5.5); padding:calc(var(--u)*2.4) 0; width:calc(var(--u)*60); border:0; border-radius:calc(var(--u)*2.5); background:linear-gradient(#e53935,#b71c1c); box-shadow:0 4px 0 #6d0f0f; }
  .big.alt { background:linear-gradient(#1e88e5,#0d47a1); box-shadow:0 4px 0 #082a63; }
  .big.dim { background:linear-gradient(#546e7a,#37474f); box-shadow:0 4px 0 #1f2a30; }
  .big:active { transform:translateY(3px); box-shadow:0 1px 0 #000; }
  .scroll { justify-content:flex-start; overflow-y:auto; }
  .ghead { width:100%; display:flex; justify-content:space-between; align-items:center; font-size:calc(var(--u)*4.4); }
  .ghead button { background:#2b2b3a; border:1px solid #555; border-radius:calc(var(--u)*2); padding:calc(var(--u)*1.6) calc(var(--u)*3); font-size:calc(var(--u)*3.6); }
  #prev { width:calc(var(--u)*52); height:auto; border-radius:calc(var(--u)*3); border:2px solid #444; flex:none; }
  #gmsg { min-height:calc(var(--u)*4.5); color:#ff8a80; font-size:calc(var(--u)*3.6); }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:calc(var(--u)*2); width:100%; }
  .list { display:flex; flex-direction:column; gap:calc(var(--u)*2); width:100%; }
  .card { background:#1c1c28; border:2px solid #3a3a4c; border-radius:calc(var(--u)*2.5); padding:calc(var(--u)*2.2); font-size:calc(var(--u)*3.6); }
  .card span { color:#b0bec5; font-size:calc(var(--u)*3.2); }
  .card.sel { border-color:#ffd54f; background:#2a2616; }
  .sw { display:flex; flex-wrap:wrap; gap:calc(var(--u)*2); justify-content:center; align-items:center; width:100%; }
  .sw .s { width:calc(var(--u)*8); height:calc(var(--u)*8); border-radius:50%; border:2px solid #555; cursor:pointer; box-sizing:border-box; }
  .sw .s.sel { border-color:#fff; box-shadow:0 0 0 3px #ffd54f; }
  .sw input[type=color] { width:calc(var(--u)*10); height:calc(var(--u)*8); border:2px solid #555; border-radius:calc(var(--u)*2); background:none; padding:0; cursor:pointer; }
  .tiny { background:none; border:0; color:#888; text-decoration:underline; font-size:calc(var(--u)*3); margin:calc(var(--u)*3) 0; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="c" width="420" height="700"></canvas>

  <div id="menu" class="ov">
    <h1>ROAD RUSH</h1>
    <div class="sub">Best: <b id="mBest">0</b> m &nbsp;&middot;&nbsp; Coins: <b id="mCoins">0</b></div>
    <button id="playBtn" class="big">Drive</button>
    <button id="garageBtn" class="big alt">Garage</button>
    <p class="help">&larr; &rarr; or A / D to steer<br>&uarr; or W to boost &middot; &darr; or S to brake<br>P pause &middot; M mute<br>On phones, tap the left or right side of the screen</p>
  </div>

  <div id="garage" class="ov scroll hidden">
    <div class="ghead"><button id="gBack">&larr; Back</button><span>Coins: <b id="gCoins">0</b></span></div>
    <canvas id="prev" width="240" height="280"></canvas>
    <div id="gmsg"></div>
    <h3>Model</h3>
    <div id="gModels" class="grid"></div>
    <h3>Paint</h3>
    <div id="gPaint" class="sw"></div>
    <h3>Accent color</h3>
    <div id="gAccent" class="sw"></div>
    <h3>Accessories</h3>
    <div id="gAcc" class="list"></div>
    <button id="resetBtn" class="tiny">Reset all progress</button>
  </div>

  <div id="over" class="ov hidden">
    <h2>CRASH!</h2>
    <div id="oStats" class="sub"></div>
    <button id="againBtn" class="big">Drive again</button>
    <button id="oGarageBtn" class="big alt">Garage</button>
    <button id="oMenuBtn" class="big dim">Menu</button>
  </div>

  <div id="pause" class="ov hidden">
    <h2>PAUSED</h2>
    <button id="resBtn" class="big">Resume</button>
    <button id="quitBtn" class="big dim">Quit to menu</button>
  </div>
</div>

<script>
(function () {
"use strict";

var W = 420, H = 700, ROAD_L = 60, ROAD_R = 360, LW = 75;
var KEY = "roadrush_save_v1";

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var prev = document.getElementById("prev");
var pctx = prev.getContext("2d");

// ---------- Data ----------
var MODELS = {
  hatch:  { name: "Hatchback", cost: 0,   w: 38, h: 70, r: 9,  cab: [-0.22, -0.08, 0.14, 0.28], bed: false, scoop: false },
  sport:  { name: "Sprinter",  cost: 300, w: 40, h: 80, r: 13, cab: [-0.12, 0.0, 0.15, 0.27],   bed: false, scoop: false },
  truck:  { name: "Hauler",    cost: 500, w: 44, h: 96, r: 6,  cab: [-0.30, -0.20, -0.08, 0.0], bed: true,  scoop: false },
  muscle: { name: "Bruiser",   cost: 800, w: 43, h: 86, r: 8,  cab: [-0.14, -0.02, 0.16, 0.28], bed: false, scoop: true }
};

var ACC = {
  spoiler: { name: "Spoiler",        cost: 150 },
  stripes: { name: "Racing stripes", cost: 100 },
  rack:    { name: "Roof rack",      cost: 120 },
  neon:    { name: "Neon underglow", cost: 250 },
  flames:  { name: "Exhaust flames", cost: 200 }
};

var COLORS = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#00897b", "#1e88e5",
              "#283593", "#8e24aa", "#ec407a", "#f5f5f5", "#b0bec5", "#212121"];
var TRAFFIC = ["#90a4ae", "#8d6e63", "#5c6bc0", "#26a69a", "#ef5350", "#ffa726", "#bdbdbd", "#7e57c2", "#66bb6a"];

var PAL = [
  { grass: [47, 125, 50],   tree: "#1b5e20", hi: "#2e7d32" },
  { grass: [201, 170, 98],  tree: "#8d6e3f", hi: "#a9854d" },
  { grass: [222, 232, 240], tree: "#78909c", hi: "#b0bec5" },
  { grass: [122, 98, 42],   tree: "#bf5b17", hi: "#e68a2e" }
];

// ---------- Save data ----------
function defaultSave() {
  return {
    best: 0, coins: 0,
    ownedModels: ["hatch"], ownedAcc: [],
    car: { model: "hatch", paint: "#e53935", accent: "#f5f5f5",
           acc: { spoiler: false, stripes: false, rack: false, neon: false, flames: false } }
  };
}
var save = defaultSave();

function isHex(s) { return typeof s === "string" && /^#[0-9a-fA-F]{6}$/.test(s); }

function loadSave() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var s = JSON.parse(raw), d = defaultSave(), k;
    if (typeof s.best === "number") d.best = s.best;
    if (typeof s.coins === "number") d.coins = s.coins;
    if (Array.isArray(s.ownedModels)) d.ownedModels = s.ownedModels.filter(function (m) { return MODELS.hasOwnProperty(m); });
    if (d.ownedModels.indexOf("hatch") < 0) d.ownedModels.push("hatch");
    if (Array.isArray(s.ownedAcc)) d.ownedAcc = s.ownedAcc.filter(function (a) { return ACC.hasOwnProperty(a); });
    if (s.car) {
      if (MODELS.hasOwnProperty(s.car.model) && d.ownedModels.indexOf(s.car.model) >= 0) d.car.model = s.car.model;
      if (isHex(s.car.paint)) d.car.paint = s.car.paint;
      if (isHex(s.car.accent)) d.car.accent = s.car.accent;
      if (s.car.acc) for (k in ACC) d.car.acc[k] = !!s.car.acc[k] && d.ownedAcc.indexOf(k) >= 0;
    }
    save = d;
  } catch (e) {}
}

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {}
}

// ---------- Drawing helpers ----------
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r);
  g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function trap(g, y0, w0, y1, w1) {
  g.beginPath();
  g.moveTo(-w0 / 2, y0);
  g.lineTo(w0 / 2, y0);
  g.lineTo(w1 / 2, y1);
  g.lineTo(-w1 / 2, y1);
  g.closePath();
}

function shade(hex, f) {
  var n = parseInt(hex.slice(1), 16);
  var r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  var t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r);
  g = Math.round((t - g) * p + g);
  b = Math.round((t - b) * p + b);
  return "rgb(" + r + "," + g + "," + b + ")";
}

// Draws a car seen from above, facing up
function drawCar(g, cx, cy, car, o) {
  o = o || {};
  var m = MODELS[car.model], w = m.w, h = m.h, acc = car.acc || {}, s = o.s || 1;
  var cab = m.cab;

  g.save();
  g.translate(cx, cy);
  if (o.tilt) g.rotate(o.tilt);
  g.scale(s, s);

  // neon underglow
  if (acc.neon) {
    g.save();
    g.shadowColor = car.accent;
    g.shadowBlur = 26;
    g.fillStyle = car.accent;
    g.globalAlpha = 0.55;
    rr(g, -w / 2 - 3, -h / 2 - 3, w + 6, h + 6, m.r + 4);
    g.fill();
    g.restore();
  }

  // exhaust flames
  if (acc.flames && o.flame > 0) {
    var L = (10 + Math.random() * 16) * o.flame * 1.6;
    [-1, 1].forEach(function (sx) {
      var fx = sx * w * 0.26;
      g.fillStyle = "rgba(255,110,0,0.9)";
      g.beginPath(); g.moveTo(fx - 4, h / 2 - 2); g.lineTo(fx, h / 2 + L); g.lineTo(fx + 4, h / 2 - 2); g.closePath(); g.fill();
      g.fillStyle = "rgba(255,230,120,0.95)";
      g.beginPath(); g.moveTo(fx - 2, h / 2 - 2); g.lineTo(fx, h / 2 + L * 0.55); g.lineTo(fx + 2, h / 2 - 2); g.closePath(); g.fill();
    });
  }

  // wheels
  g.fillStyle = "#111";
  var wy = h * 0.27;
  [-1, 1].forEach(function (sx) {
    [-1, 1].forEach(function (sy) {
      rr(g, sx * (w / 2) - (sx > 0 ? 2 : 5), sy * wy - 8, 7, 16, 2);
      g.fill();
    });
  });

  // body
  rr(g, -w / 2, -h / 2, w, h, m.r);
  g.fillStyle = car.paint;
  g.fill();
  g.lineWidth = 1.5;
  g.strokeStyle = "rgba(0,0,0,0.4)";
  g.stroke();

  g.fillStyle = "rgba(255,255,255,0.13)";
  rr(g, -w / 2 + 3, -h / 2 + 3, w * 0.32, h - 6, Math.max(2, m.r - 2));
  g.fill();

  // racing stripes
  if (acc.stripes) {
    g.fillStyle = car.accent;
    g.fillRect(-w * 0.17, -h / 2 + 1, w * 0.1, h - 2);
    g.fillRect(w * 0.07, -h / 2 + 1, w * 0.1, h - 2);
  }

  // truck bed
  if (m.bed) {
    var bedY = h * 0.04, bedH = h * 0.43;
    rr(g, -w / 2 + 4, bedY, w - 8, bedH, 3);
    g.fillStyle = shade(car.paint, -0.38);
    g.fill();
    g.fillStyle = "rgba(0,0,0,0.3)";
    for (var i = 1; i < 4; i++) g.fillRect(-w / 2 + 4, bedY + i * bedH / 4, w - 8, 1);
  }

  // roof
  var roofY = cab[1] * h, roofH = (cab[2] - cab[1]) * h;
  rr(g, -w * 0.38, roofY, w * 0.76, roofH, 3);
  g.fillStyle = shade(car.paint, -0.12);
  g.fill();

  // glass
  g.fillStyle = "#1c2733";
  trap(g, cab[0] * h, w * 0.64, cab[1] * h, w * 0.76);
  g.fill();
  trap(g, cab[2] * h, w * 0.76, cab[3] * h, w * 0.62);
  g.fill();

  // hood scoop
  if (m.scoop) {
    rr(g, -w * 0.15, -h * 0.38, w * 0.3, h * 0.12, 3);
    g.fillStyle = "#1d1d1d";
    g.fill();
  }

  // lights
  g.fillStyle = "#fff7b8";
  rr(g, -w * 0.38, -h / 2 + 1, w * 0.2, 4, 1); g.fill();
  rr(g, w * 0.18, -h / 2 + 1, w * 0.2, 4, 1); g.fill();
  g.fillStyle = "#ff3b3b";
  rr(g, -w * 0.38, h / 2 - 5, w * 0.22, 4, 1); g.fill();
  rr(g, w * 0.16, h / 2 - 5, w * 0.22, 4, 1); g.fill();

  // roof rack
  if (acc.rack) {
    g.strokeStyle = "#1b1b1b";
    g.lineWidth = 1.6;
    g.strokeRect(-w * 0.3, roofY + 2, w * 0.6, Math.max(4, roofH - 4));
    g.beginPath();
    g.moveTo(-w * 0.3, roofY + roofH / 2);
    g.lineTo(w * 0.3, roofY + roofH / 2);
    g.stroke();
  }

  // spoiler
  if (acc.spoiler) {
    g.fillStyle = "#222";
    g.fillRect(-w * 0.3, h / 2 - 9, 3, 8);
    g.fillRect(w * 0.3 - 3, h / 2 - 9, 3, 8);
    rr(g, -w * 0.55, h / 2 - 4, w * 1.1, 7, 2);
    g.fillStyle = car.accent;
    g.fill();
    g.lineWidth = 1;
    g.strokeStyle = "rgba(0,0,0,0.5)";
    g.stroke();
  }

  g.restore();
}

// ---------- Audio ----------
var AC = null, eng = null, engG = null, muted = false;

function audioInit() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (AC && AC.state === "suspended") AC.resume();
}

function tone(freq, dur, vol, type, slideTo) {
  if (!AC || muted) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain(), now = AC.currentTime;
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, now);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(now + dur);
  } catch (e) {}
}

function startEngine() {
  if (!AC || eng) return;
  try {
    eng = AC.createOscillator();
    engG = AC.createGain();
    eng.type = "sawtooth";
    eng.frequency.value = 60;
    engG.gain.value = muted ? 0 : 0.022;
    eng.connect(engG); engG.connect(AC.destination);
    eng.start();
  } catch (e) { eng = null; }
}

function stopEngine() {
  if (eng) { try { eng.stop(); } catch (e) {} }
  eng = null; engG = null;
}

function updateEngine(speed) {
  if (eng && AC) {
    try { eng.frequency.setTargetAtTime(55 + speed * 0.22, AC.currentTime, 0.05); } catch (e) {}
  }
}

function toggleMute() {
  muted = !muted;
  if (engG) engG.gain.value = muted ? 0 : 0.022;
}

// ---------- Game state ----------
var state = "menu";
var G = null;
var keys = { left: false, right: false, up: false, down: false };
var touchDir = 0;

function rndSide() { return Math.random() < 0.5; }

function newGame(idle) {
  var g = {
    idle: idle, t: 0, dist: 0, speed: idle ? 150 : 230, mult: 1,
    px: 210, py: 560, vx: 0, scroll: 0,
    cars: [], coins: [], decor: [], parts: [], texts: [],
    spawnAcc: 0, gap: 420, coinAcc: 0, coinGap: 700, lastFree: [0, 1, 2, 3],
    laneV: [], coinsGot: 0, crashed: false, overT: 0, finished: false,
    shake: 0, spin: 0, spinDir: 1, record: false, banner: null,
    palIdx: 0, grass: PAL[0].grass.slice(), decorAcc: 0
  };
  for (var i = 0; i < 4; i++) g.laneV.push(90 + Math.random() * 60);
  for (i = 0; i < 14; i++) {
    g.decor.push({ x: rndSide() ? 8 + Math.random() * 40 : 372 + Math.random() * 40, y: Math.random() * H, r: 9 + Math.random() * 8 });
  }
  return g;
}

function laneX(i) { return ROAD_L + LW * i + LW / 2; }

function compat(a, b) {
  for (var i = 0; i < a.length; i++) for (var j = 0; j < b.length; j++) if (Math.abs(a[i] - b[j]) <= 1) return true;
  return false;
}

function addCar(lane, y) {
  var keysM = Object.keys(MODELS);
  var model = keysM[Math.floor(Math.random() * keysM.length)];
  var m = MODELS[model];
  G.cars.push({
    x: laneX(lane), y: y, v: G.laneV[lane], passed: false, mw: m.w, mh: m.h,
    car: { model: model, paint: TRAFFIC[Math.floor(Math.random() * TRAFFIC.length)], accent: "#ffffff", acc: {} }
  });
}

function spawnRow() {
  var lanes = [0, 1, 2, 3], n = Math.random() < 0.4 ? 2 : 1, pick, free, tries = 0;
  do {
    var pool = lanes.slice();
    pick = [];
    for (var i = 0; i < n; i++) pick.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    free = lanes.filter(function (l) { return pick.indexOf(l) < 0; });
    tries++;
  } while (!compat(G.lastFree, free) && tries < 12);
  G.lastFree = free;
  pick.forEach(function (l) { addCar(l, -130); });
}

function spawnCoins() {
  var lane = G.lastFree[Math.floor(Math.random() * G.lastFree.length)];
  var n = 3 + Math.floor(Math.random() * 3);
  for (var k = 0; k < n; k++) G.coins.push({ x: laneX(lane), y: -40 - k * 38 });
}

function addText(txt, x, y) { G.texts.push({ txt: txt, x: x, y: y, life: 1 }); }

function moveDecor(dt) {
  G.decorAcc += G.speed * dt;
  if (G.decorAcc >= 70) {
    G.decorAcc = Math.random() * 30;
    G.decor.push({ x: rndSide() ? 8 + Math.random() * 40 : 372 + Math.random() * 40, y: -30, r: 9 + Math.random() * 8 });
  }
  for (var i = G.decor.length - 1; i >= 0; i--) {
    var d = G.decor[i];
    d.y += G.speed * dt;
    if (d.y > H + 40) G.decor.splice(i, 1);
  }
}

function crash() {
  G.crashed = true;
  G.shake = 0.5;
  G.spinDir = rndSide() ? -1 : 1;
  stopEngine();
  tone(90, 0.5, 0.35, "sawtooth", 30);
  tone(400, 0.15, 0.25, "square", 80);
  for (var i = 0; i < 36; i++) {
    G.parts.push({
      x: G.px + (Math.random() - 0.5) * 20, y: G.py + (Math.random() - 0.5) * 30,
      vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.9) * 220,
      life: 0.8 + Math.random() * 0.8, size: 2 + Math.random() * 4,
      color: i % 3 === 0 ? "#ffb300" : (i % 3 === 1 ? save.car.paint : "#333")
    });
  }
}

function update(dt) {
  var m = MODELS[save.car.model], i;
  G.t += dt;

  G.palIdx = Math.floor(G.dist / 800) % PAL.length;
  var tg = PAL[G.palIdx].grass, k = Math.min(1, dt * 0.8);
  for (i = 0; i < 3; i++) G.grass[i] += (tg[i] - G.grass[i]) * k;

  if (G.idle) {
    G.speed = 150;
    G.scroll = (G.scroll + G.speed * dt) % 80;
    moveDecor(dt);
    return;
  }

  if (!G.crashed) {
    var base = 230 + 300 * (1 - Math.exp(-G.t / 80));
    var tm = keys.up ? 1.25 : (keys.down ? 0.72 : 1);
    G.mult += (tm - G.mult) * Math.min(1, dt * 4);
    G.speed = base * G.mult;

    var dir = ((keys.left || touchDir < 0) ? -1 : 0) + ((keys.right || touchDir > 0) ? 1 : 0);
    G.vx += (dir * 320 - G.vx) * Math.min(1, dt * 9);
    G.px += G.vx * dt;
    var hw = m.w / 2, minX = ROAD_L + hw + 2, maxX = ROAD_R - hw - 2;
    if (G.px < minX) { G.px = minX; G.vx = 0; }
    if (G.px > maxX) { G.px = maxX; G.vx = 0; }

    G.dist += G.speed * dt / 12;
    updateEngine(G.speed);
  } else {
    G.speed = Math.max(0, G.speed - G.speed * Math.min(1, dt * 2.2));
    G.spin += G.spinDir * 7 * dt * (G.speed / 200 + 0.2);
    G.overT += dt;
    G.shake = Math.max(0, G.shake - dt);
  }

  G.scroll = (G.scroll + G.speed * dt) % 80;
  moveDecor(dt);

  if (!G.crashed) {
    G.spawnAcc += G.speed * dt;
    if (G.spawnAcc >= G.gap) {
      G.spawnAcc = 0;
      G.gap = Math.max(240, 420 - G.t * 2.5) + Math.random() * 60;
      spawnRow();
    }
    G.coinAcc += G.speed * dt;
    if (G.coinAcc >= G.coinGap) {
      G.coinAcc = 0;
      G.coinGap = 900 + Math.random() * 600;
      spawnCoins();
    }
  }

  var hh = m.h * 0.42, hwp = m.w * 0.4;
  for (i = G.cars.length - 1; i >= 0; i--) {
    var c = G.cars[i];
    c.y += Math.max(0, G.speed - c.v) * dt;
    if (c.y > H + 150) { G.cars.splice(i, 1); continue; }
    if (!G.crashed) {
      if (!c.passed && c.y > G.py) {
        c.passed = true;
        var gap = Math.abs(G.px - c.x) - (m.w / 2 + c.mw / 2);
        if (gap < 10) { G.dist += 5; addText("NEAR MISS +5", c.x, G.py - 50); tone(900, 0.08, 0.1, "triangle", 1300); }
      }
      if (Math.abs(G.px - c.x) < hwp + c.mw * 0.4 && Math.abs(G.py - c.y) < hh + c.mh * 0.42) crash();
    }
  }

  for (i = G.coins.length - 1; i >= 0; i--) {
    var co = G.coins[i];
    co.y += G.speed * dt;
    if (co.y > H + 40) { G.coins.splice(i, 1); continue; }
    if (!G.crashed && Math.abs(co.x - G.px) < m.w / 2 + 8 && Math.abs(co.y - G.py) < m.h / 2 + 8) {
      G.coins.splice(i, 1);
      G.coinsGot++;
      tone(880, 0.12, 0.12, "triangle", 1320);
    }
  }

  if (!G.crashed && save.best > 0 && !G.record && G.dist > save.best) {
    G.record = true;
    G.banner = { txt: "NEW RECORD!", t: 2.2 };
    tone(660, 0.25, 0.2, "triangle", 1320);
  }
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }

  for (i = G.parts.length - 1; i >= 0; i--) {
    var p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += (p.vy + G.speed * 0.5) * dt;
    p.vx *= 0.98;
  }
  for (i = G.texts.length - 1; i >= 0; i--) {
    var tx = G.texts[i];
    tx.life -= dt * 0.9;
    tx.y -= 30 * dt;
    if (tx.life <= 0) G.texts.splice(i, 1);
  }

  if (G.crashed && G.overT > 1.2 && !G.finished) finishRun();
}

// ---------- Rendering ----------
function render() {
  var sx = 0, sy = 0, i;
  if (G.shake > 0) { sx = (Math.random() - 0.5) * G.shake * 24; sy = (Math.random() - 0.5) * G.shake * 24; }

  ctx.save();
  ctx.translate(sx, sy);

  ctx.fillStyle = "rgb(" + (G.grass[0] | 0) + "," + (G.grass[1] | 0) + "," + (G.grass[2] | 0) + ")";
  ctx.fillRect(-20, -20, W + 40, H + 40);

  var y;
  ctx.fillStyle = "rgba(0,0,0,0.06)";
  for (y = -80 + (G.scroll % 80); y < H; y += 80) {
    ctx.fillRect(0, y, ROAD_L, 40);
    ctx.fillRect(ROAD_R, y, W - ROAD_R, 40);
  }

  var pal = PAL[G.palIdx];
  for (i = 0; i < G.decor.length; i++) {
    var d = G.decor[i];
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.arc(d.x + 3, d.y + 4, d.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pal.tree;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pal.hi;
    ctx.beginPath(); ctx.arc(d.x - d.r * 0.25, d.y - d.r * 0.25, d.r * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = "#3a3a44";
  ctx.fillRect(ROAD_L, -20, ROAD_R - ROAD_L, H + 40);
  ctx.fillStyle = "#e8e8e8";
  ctx.fillRect(ROAD_L + 4, -20, 4, H + 40);
  ctx.fillRect(ROAD_R - 8, -20, 4, H + 40);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  for (var l = 1; l < 4; l++) {
    var lx = ROAD_L + LW * l;
    for (y = -80 + (G.scroll % 80); y < H; y += 80) ctx.fillRect(lx - 2, y, 4, 40);
  }

  for (i = 0; i < G.coins.length; i++) {
    var co = G.coins[i], sc = Math.abs(Math.cos(G.t * 5 + co.y * 0.05));
    ctx.fillStyle = "#ffd54f";
    ctx.beginPath(); ctx.ellipse(co.x, co.y, 8 * sc + 2, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#c79100"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#fff59d";
    ctx.beginPath(); ctx.ellipse(co.x, co.y, 4 * sc + 1, 5, 0, 0, Math.PI * 2); ctx.fill();
  }

  for (i = 0; i < G.cars.length; i++) drawCar(ctx, G.cars[i].x, G.cars[i].y, G.cars[i].car, {});

  if (G.idle) {
    drawCar(ctx, 210, 540, save.car, { flame: 0.3 });
  } else {
    var tilt = G.crashed ? G.spin : G.vx / 320 * 0.14;
    var fl = (!G.crashed && G.mult > 1.05) ? Math.min(1, (G.mult - 1) / 0.2) : 0;
    drawCar(ctx, G.px, G.py, save.car, { tilt: tilt, flame: fl });
  }

  for (i = 0; i < G.parts.length; i++) {
    var p = G.parts[i];
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  if (state === "play" || state === "over" || state === "paused") {
    ctx.shadowColor = "rgba(0,0,0,0.85)";
    ctx.shadowBlur = 4;
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.font = "bold 30px Arial";
    ctx.fillText(Math.floor(G.dist) + " m", 14, 40);
    ctx.font = "bold 15px Arial";
    ctx.fillText(Math.round(G.speed * 0.3) + " km/h", 14, 62);
    ctx.textAlign = "right";
    ctx.fillText("BEST " + Math.max(save.best, Math.floor(G.dist)) + " m", W - 14, 28);
    ctx.fillStyle = "#ffd54f";
    ctx.fillText("+" + (G.coinsGot * 5) + " coins", W - 14, 50);

    ctx.textAlign = "center";
    ctx.font = "bold 16px Arial";
    for (i = 0; i < G.texts.length; i++) {
      var t = G.texts[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life));
      ctx.fillStyle = "#fff176";
      ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    if (G.banner) {
      ctx.font = "bold 38px Arial";
      ctx.fillStyle = "#ffd54f";
      ctx.fillText(G.banner.txt, W / 2, 160);
    }
    ctx.shadowBlur = 0;
    ctx.textAlign = "left";
  }
}

// ---------- Screens ----------
var ovs = {
  menu: document.getElementById("menu"),
  garage: document.getElementById("garage"),
  over: document.getElementById("over"),
  pause: document.getElementById("pause")
};
var mBest = document.getElementById("mBest");
var mCoins = document.getElementById("mCoins");
var oStats = document.getElementById("oStats");
var gCoins = document.getElementById("gCoins");
var gmsg = document.getElementById("gmsg");
var gModels = document.getElementById("gModels");
var gPaint = document.getElementById("gPaint");
var gAccent = document.getElementById("gAccent");
var gAcc = document.getElementById("gAcc");
var prevRAF = 0, msgTimer = 0;

function showOv(name) {
  for (var k in ovs) ovs[k].classList.add("hidden");
  if (name) ovs[name].classList.remove("hidden");
}

function refreshMenu() {
  mBest.textContent = save.best;
  mCoins.textContent = save.coins;
}

function toMenu() {
  state = "menu";
  G = newGame(true);
  stopEngine();
  cancelAnimationFrame(prevRAF);
  refreshMenu();
  showOv("menu");
}

function startRun() {
  audioInit();
  cancelAnimationFrame(prevRAF);
  state = "play";
  G = newGame(false);
  showOv(null);
  startEngine();
}

function pause() {
  if (state === "play" && !G.crashed) {
    state = "paused";
    stopEngine();
    showOv("pause");
  }
}

function resume() {
  if (state === "paused") {
    audioInit();
    state = "play";
    showOv(null);
    startEngine();
  }
}

function finishRun() {
  G.finished = true;
  var dist = Math.floor(G.dist);
  var bonus = Math.floor(dist / 20);
  var earned = G.coinsGot * 5 + bonus;
  var isRecord = dist > save.best;
  if (isRecord) save.best = dist;
  save.coins += earned;
  persist();
  state = "over";
  oStats.innerHTML =
    "Distance: <b>" + dist + " m</b><br>" +
    (isRecord ? "<b style='color:#ffd54f'>NEW RECORD!</b>" : "Best: " + save.best + " m") + "<br>" +
    "Coins: " + (G.coinsGot * 5) + " + " + bonus + " distance bonus = <b>+" + earned + "</b>";
  showOv("over");
}

// ---------- Garage ----------
function msgG(t) {
  gmsg.textContent = t;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(function () { gmsg.textContent = ""; }, 2200);
}

function pickModel(k) {
  var m = MODELS[k];
  if (save.ownedModels.indexOf(k) >= 0) {
    save.car.model = k;
  } else if (save.coins >= m.cost) {
    save.coins -= m.cost;
    save.ownedModels.push(k);
    save.car.model = k;
    msgG("Bought the " + m.name + "!");
    tone(660, 0.2, 0.15, "triangle", 990);
  } else {
    msgG("Not enough coins (" + m.cost + " needed).");
    return;
  }
  persist();
  buildGarage();
}

function toggleAcc(k) {
  var a = ACC[k];
  if (save.ownedAcc.indexOf(k) >= 0) {
    save.car.acc[k] = !save.car.acc[k];
  } else if (save.coins >= a.cost) {
    save.coins -= a.cost;
    save.ownedAcc.push(k);
    save.car.acc[k] = true;
    msgG("Bought " + a.name + "!");
    tone(660, 0.2, 0.15, "triangle", 990);
  } else {
    msgG("Not enough coins (" + a.cost + " needed).");
    return;
  }
  persist();
  buildGarage();
}

function swatches(box, cur, onPick) {
  box.innerHTML = "";
  COLORS.forEach(function (c) {
    var d = document.createElement("div");
    d.className = "s" + (c.toLowerCase() === cur.toLowerCase() ? " sel" : "");
    d.style.background = c;
    d.addEventListener("click", function () { onPick(c, false); });
    box.appendChild(d);
  });
  var inp = document.createElement("input");
  inp.type = "color";
  inp.value = cur;
  inp.title = "Custom color";
  inp.addEventListener("input", function () { onPick(inp.value, true); });
  box.appendChild(inp);
}

function buildGarage() {
  gCoins.textContent = save.coins;

  gModels.innerHTML = "";
  Object.keys(MODELS).forEach(function (k) {
    var m = MODELS[k], owned = save.ownedModels.indexOf(k) >= 0;
    var b = document.createElement("button");
    b.className = "card" + (save.car.model === k ? " sel" : "");
    b.innerHTML = "<b>" + m.name + "</b><br><span>" + (save.car.model === k ? "Equipped" : (owned ? "Owned" : "Buy: " + m.cost)) + "</span>";
    b.addEventListener("click", function () { pickModel(k); });
    gModels.appendChild(b);
  });

  swatches(gPaint, save.car.paint, function (c, custom) {
    save.car.paint = c; persist();
    if (!custom) buildGarage();
  });
  swatches(gAccent, save.car.accent, function (c, custom) {
    save.car.accent = c; persist();
    if (!custom) buildGarage();
  });

  gAcc.innerHTML = "";
  Object.keys(ACC).forEach(function (k) {
    var a = ACC[k], owned = save.ownedAcc.indexOf(k) >= 0, on = owned && save.car.acc[k];
    var b = document.createElement("button");
    b.className = "card" + (on ? " sel" : "");
    b.innerHTML = "<b>" + a.name + "</b> &nbsp; <span>" + (on ? "On" : (owned ? "Off (owned)" : "Buy: " + a.cost)) + "</span>";
    b.addEventListener("click", function () { toggleAcc(k); });
    gAcc.appendChild(b);
  });
}

function drawPreview(now) {
  pctx.clearRect(0, 0, prev.width, prev.height);
  var g = pctx.createRadialGradient(120, 150, 10, 120, 150, 170);
  g.addColorStop(0, "#3a3a4c");
  g.addColorStop(1, "#14141c");
  pctx.fillStyle = g;
  pctx.fillRect(0, 0, prev.width, prev.height);
  pctx.fillStyle = "rgba(255,255,255,0.06)";
  pctx.beginPath();
  pctx.ellipse(120, 150, 90, 120, 0, 0, Math.PI * 2);
  pctx.fill();
  drawCar(pctx, 120, 150, save.car, { s: 2.1, flame: 0.6 + 0.4 * Math.sin(now / 90) });
  if (state === "garage") prevRAF = requestAnimationFrame(drawPreview);
}

function openGarage() {
  audioInit();
  state = "garage";
  G = newGame(true);
  stopEngine();
  showOv("garage");
  ovs.garage.scrollTop = 0;
  buildGarage();
  cancelAnimationFrame(prevRAF);
  prevRAF = requestAnimationFrame(drawPreview);
}

// ---------- Input ----------
function setKey(code, v) {
  if (code === "ArrowLeft" || code === "KeyA") keys.left = v;
  else if (code === "ArrowRight" || code === "KeyD") keys.right = v;
  else if (code === "ArrowUp" || code === "KeyW") keys.up = v;
  else if (code === "ArrowDown" || code === "KeyS") keys.down = v;
}

document.addEventListener("keydown", function (e) {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].indexOf(e.code) >= 0 && state === "play") e.preventDefault();
  setKey(e.code, true);
  if (e.repeat) return;
  if (e.code === "KeyP" || e.code === "Escape") {
    if (state === "play") pause();
    else if (state === "paused") resume();
  }
  if (e.code === "KeyM") toggleMute();
});
document.addEventListener("keyup", function (e) { setKey(e.code, false); });
window.addEventListener("blur", function () { keys.left = keys.right = keys.up = keys.down = false; touchDir = 0; });
document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); });

function pointerDir(e) {
  var r = canvas.getBoundingClientRect();
  touchDir = (e.clientX - r.left) < r.width / 2 ? -1 : 1;
}
canvas.addEventListener("pointerdown", function (e) { if (state === "play") pointerDir(e); });
canvas.addEventListener("pointermove", function (e) { if (state === "play" && e.buttons) pointerDir(e); });
["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
  canvas.addEventListener(ev, function () { touchDir = 0; });
});

document.getElementById("playBtn").addEventListener("click", startRun);
document.getElementById("garageBtn").addEventListener("click", openGarage);
document.getElementById("gBack").addEventListener("click", toMenu);
document.getElementById("againBtn").addEventListener("click", startRun);
document.getElementById("oGarageBtn").addEventListener("click", openGarage);
document.getElementById("oMenuBtn").addEventListener("click", toMenu);
document.getElementById("resBtn").addEventListener("click", resume);
document.getElementById("quitBtn").addEventListener("click", toMenu);
document.getElementById("resetBtn").addEventListener("click", function () {
  if (!confirm("Reset your record, coins, and garage?")) return;
  save = defaultSave();
  persist();
  buildGarage();
  refreshMenu();
});

// ---------- Main loop ----------
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state !== "paused") update(dt);
  render();
  requestAnimationFrame(frame);
}

loadSave();
toMenu();
requestAnimationFrame(frame);

})();
</script>
</body>
